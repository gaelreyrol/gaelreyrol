directory: charts
repositories:
  - name: nginx
    url: https://kubernetes.github.io/ingress-nginx
  - name: dashboard
    url: https://kubernetes.github.io/dashboard
  - name: metrics
    url: https://kubernetes-sigs.github.io/metrics-server
  - name: certmanager
    url: https://charts.jetstack.io
  - name: fairwinds
    url: https://charts.fairwinds.com/stable
  - name: 1password
    url: https://1password.github.io/connect-helm-charts
  - name: externalsecrets
    url: https://charts.external-secrets.io/
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: bytebase
    url: https://bytebase.github.io/bytebase
  - name: cnpg
    url: https://cloudnative-pg.github.io/charts
requires:
  - chart: metrics/metrics-server
    version: 3.12.2
  - chart: dashboard/kubernetes-dashboard
    version: 7.11.1
  - chart: nginx/ingress-nginx
    version: 4.12.0
  - chart: certmanager/cert-manager
    version: 1.17.1
  - chart: fairwinds/polaris
    version: 5.18.0
  - chart: 1password/connect
    version: 1.17.0
  - chart: externalsecrets/external-secrets
    version: 0.14.4
  - chart: bytebase/bytebase
    version: 1.1.1
  - chart: bitnami/postgresql
    version: 16.5.0
  - chart: cnpg/cloudnative-pg
    version: 0.23.2
version: 1
